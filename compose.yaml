services:
  backend-hackspain:
    container_name: hackspain_backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      # CI exports/imports buildx layers via CACHE_FROM/CACHE_TO (env vars set
      # in ci.yml); local builds default to a throwaway local cache dir.
      cache_from: ["${CACHE_FROM:-type=local,src=/tmp/hackspain-cache-backend}"]
      cache_to: ["${CACHE_TO:-type=local,dest=/tmp/hackspain-cache-backend,mode=max}"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-hackspain:5432/${POSTGRES_DB:-hackspain}
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./experiments:/experiments
    depends_on:
      postgres-hackspain:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - appnet_hackspain

  postgres-hackspain:
    container_name: hackspain_db
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-hackspain}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_hackspain:/var/lib/postgresql
    networks:
      - appnet_hackspain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      # pg_isready answers instantly — poll fast so the backend starts sooner.
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  frontend-hackspain:
    container_name: hackspain_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - BACKEND_URL=http://backend-hackspain:8000
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      cache_from: ["${CACHE_FROM:-type=local,src=/tmp/hackspain-cache-frontend}"]
      cache_to: ["${CACHE_TO:-type=local,dest=/tmp/hackspain-cache-frontend,mode=max}"]
    command: bun run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/code
      - /code/node_modules
    ports:
      - "3000:5173"
    depends_on:
      - backend-hackspain
    networks:
      - appnet_hackspain

volumes:
  postgres_data_hackspain:

networks:
  appnet_hackspain:
